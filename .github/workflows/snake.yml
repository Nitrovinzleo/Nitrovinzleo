name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Seoul Editorial K-Pop Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23d81b60&color_dots=%23f4ecee,%23fecdd3,%23f43f5e,%239d174d,%23fde047
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff2d78&color_dots=%2323111c,%23700936,%239d174d,%23d81b60,%23fde047

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
