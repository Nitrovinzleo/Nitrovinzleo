<svg width="1200" height="290" viewBox="0 0 1200 290" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nitrovinzleo — Seoul Editorial Stage Edition">
  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="1200" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140810"/>
      <stop offset="55%" stop-color="#1A0912"/>
      <stop offset="100%" stop-color="#23111C"/>
    </linearGradient>
    <linearGradient id="crimsonBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2D78"/>
      <stop offset="55%" stop-color="#D81B60"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <radialGradient id="neonSpot" cx="85%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#881337" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#140810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldSpot" cx="12%" cy="88%" r="42%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#140810" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Obsidian stage container -->
  <rect width="1200" height="290" rx="18" fill="url(#stageBg)"/>
  <rect width="1200" height="290" rx="18" fill="url(#neonSpot)"/>
  <rect width="1200" height="290" rx="18" fill="url(#goldSpot)"/>
  <rect x="1" y="1" width="1198" height="288" rx="17" stroke="#9D174D" stroke-opacity="0.65" stroke-width="1.5"/>

  <!-- Editorial top hairline & masthead -->
  <line x1="48" y1="66" x2="1152" y2="66" stroke="#FBF7F8" stroke-opacity="0.14" stroke-width="1"/>
  <circle cx="54" cy="42" r="5" fill="#FF2D78"/>
  <text x="70" y="47" fill="#D9C8D0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6">
    EDITION 2026  //  EFREI PARIS  ·  SOFTWARE &amp; UX ENGINEERING
  </text>

  <!-- Gold editorial pill -->
  <rect x="974" y="28" width="178" height="26" rx="6" fill="#FDE047"/>
  <text x="1063" y="45" text-anchor="middle" fill="#5C3409" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="700" letter-spacing="0.8">
    DEV PROGRAM · LIVE
  </text>

  <!-- Asymmetric display title -->
  <text x="48" y="148" fill="#FBF7F8" font-family="'Bricolage Grotesque', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.6">
    Nitrovinzleo
  </text>

  <!-- Crimson-to-Gold signature rule -->
  <rect x="48" y="166" width="160" height="4" rx="2" fill="url(#crimsonBar)"/>

  <!-- Editorial deck / subtitle -->
  <text x="48" y="206" fill="#D9C8D0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="19" font-weight="500">
    Full-Stack Systems, WCAG AAA Editorial UX, Real-Time C++ Audio &amp; GitHub Automation.
  </text>

  <!-- Right editorial vertical issue marker -->
  <rect x="1010" y="96" width="142" height="106" rx="12" fill="#23111C" stroke="#D81B60" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="1081" y="128" text-anchor="middle" fill="#FF2D78" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1.2">
    FOCUS
  </text>
  <text x="1081" y="156" text-anchor="middle" fill="#FBF7F8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">
    Design × Code
  </text>
  <text x="1081" y="180" text-anchor="middle" fill="#FDE047" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="600">
    AAA CONTRAST
  </text>

  <!-- Bottom stack chips -->
  <g transform="translate(48, 234)" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600">
    <rect x="0" y="0" width="102" height="28" rx="6" fill="#23111C" stroke="#9D174D"/>
    <text x="51" y="18" text-anchor="middle" fill="#FFF1F2">TypeScript</text>

    <rect x="114" y="0" width="78" height="28" rx="6" fill="#23111C" stroke="#9D174D"/>
    <text x="153" y="18" text-anchor="middle" fill="#FFF1F2">Python</text>

    <rect x="204" y="0" width="58" height="28" rx="6" fill="#23111C" stroke="#9D174D"/>
    <text x="233" y="18" text-anchor="middle" fill="#FFF1F2">C++</text>

    <rect x="274" y="0" width="66" height="28" rx="6" fill="#23111C" stroke="#9D174D"/>
    <text x="307" y="18" text-anchor="middle" fill="#FFF1F2">Java</text>

    <rect x="352" y="0" width="104" height="28" rx="6" fill="#23111C" stroke="#9D174D"/>
    <text x="404" y="18" text-anchor="middle" fill="#FFF1F2">PowerShell</text>

    <rect x="468" y="0" width="112" height="28" rx="6" fill="#881337" stroke="#FF2D78"/>
    <text x="524" y="18" text-anchor="middle" fill="#FDE047">RGAA / UX</text>
  </g>
</svg>
