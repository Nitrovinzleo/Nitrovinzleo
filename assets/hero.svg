<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nitrovinzleo - Software Engineering at EFREI Paris">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Base container -->
  <rect width="1200" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="280" rx="14" fill="url(#emeraldGlow)"/>
  <rect x="1" y="1" width="1198" height="278" rx="13" stroke="#475569" stroke-width="1.5"/>

  <!-- Top status bar -->
  <rect x="48" y="38" width="10" height="10" rx="5" fill="#22C55E"/>
  <text x="68" y="47" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" letter-spacing="1.2">
    EFREI PARIS  /  SOFTWARE ENGINEERING
  </text>

  <!-- Right terminal badge -->
  <rect x="944" y="30" width="208" height="28" rx="6" fill="#1B2336" stroke="#475569" stroke-width="1"/>
  <text x="1048" y="48" text-anchor="middle" fill="#22C55E" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600">
    $ status --active
  </text>

  <!-- Main Heading -->
  <text x="48" y="132" fill="#F8FAFC" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" letter-spacing="-1.2">
    Nitrovinzleo
  </text>

  <!-- Accent divider -->
  <rect x="48" y="152" width="84" height="3" rx="1.5" fill="#22C55E"/>

  <!-- Subtitle -->
  <text x="48" y="192" fill="#94A3B8" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="400">
    Building full-stack web apps, real-time C++ audio tools, and automation pipelines.
  </text>

  <!-- Bottom technical pills -->
  <g transform="translate(48, 222)" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="500">
    <rect x="0" y="0" width="96" height="28" rx="6" fill="#1B2336" stroke="#334155"/>
    <text x="48" y="18" text-anchor="middle" fill="#F8FAFC">TypeScript</text>

    <rect x="108" y="0" width="76" height="28" rx="6" fill="#1B2336" stroke="#334155"/>
    <text x="146" y="18" text-anchor="middle" fill="#F8FAFC">Python</text>

    <rect x="196" y="0" width="60" height="28" rx="6" fill="#1B2336" stroke="#334155"/>
    <text x="226" y="18" text-anchor="middle" fill="#F8FAFC">C++</text>

    <rect x="268" y="0" width="66" height="28" rx="6" fill="#1B2336" stroke="#334155"/>
    <text x="301" y="18" text-anchor="middle" fill="#F8FAFC">Java</text>

    <rect x="346" y="0" width="102" height="28" rx="6" fill="#1B2336" stroke="#334155"/>
    <text x="397" y="18" text-anchor="middle" fill="#F8FAFC">PowerShell</text>
  </g>
</svg>
