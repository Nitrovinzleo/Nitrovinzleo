    <rect x="758" y="402" width="98" height="24" rx="6" fill="#FDE047"/>
    <text x="807" y="418" text-anchor="middle" fill="#5C3409" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800">
