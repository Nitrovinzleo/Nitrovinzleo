  </defs>

  <!-- Warm Paper Editorial Canvas (#FAF7F6) -->
  <rect width="1200" height="620" rx="18" fill="#FAF7F6"/>
  <rect x="0.75" y="0.75" width="1198.5" height="618.5" rx="17.25" stroke="#120B10" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Top Masthead Header (clean, no fake nav links) -->
  <path d="M 1 18 Q 1 1 18 1 H 1182 Q 1199 1 1199 18 V 68 H 1 Z" fill="#FFFDFD"/>
  <line x1="1" y1="68" x2="1199" y2="68" stroke="#120B10" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Wordmark Left (single text + tspan so it can never overlap) -->
  <text x="44" y="43" fill="#120B10" font-family="'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.6">
    VINCENT HOEBLER<tspan dx="16" fill="#9D174D" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" letter-spacing="0.6">/ NITROVINZLEO · PARIS</tspan>
  </text>

  <!-- Asymmetric Editorial Headline Row -->
  <text x="44" y="138" fill="#120B10" font-family="'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="44" font-weight="800" letter-spacing="-1.3">
    Software Engineer
  </text>
  <text x="44" y="190" fill="#120B10" font-family="'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="44" font-weight="800" letter-spacing="-1.3">
