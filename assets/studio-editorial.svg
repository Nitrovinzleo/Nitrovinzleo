<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nitrovinzleo — Paris Edition Editorial Profile">
  <defs>
    <linearGradient id="rubyCover" x1="0" y1="0" x2="420" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="55%" stop-color="#9D174D"/>
      <stop offset="100%" stop-color="#140810"/>
    </linearGradient>
    <linearGradient id="pianoStage" x1="0" y1="0" x2="640" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1520"/>
      <stop offset="100%" stop-color="#281D2B"/>
    </linearGradient>
    <clipPath id="leftCardClip">
      <rect x="44" y="238" width="664" height="338" rx="16"/>
    </clipPath>
    <clipPath id="rightCardClip">
      <rect x="734" y="238" width="422" height="338" rx="16"/>
    </clipPath>
  </defs>

  <!-- Warm Paper Editorial Canvas (#FAF7F6) -->
  <rect width="1200" height="620" rx="18" fill="#FAF7F6"/>
  <rect x="0.75" y="0.75" width="1198.5" height="618.5" rx="17.25" stroke="#120B10" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Top Masthead Header (clean, no fake nav links) -->
  <path d="M 1 18 Q 1 1 18 1 H 1182 Q 1199 1 1199 18 V 68 H 1 Z" fill="#FFFDFD"/>
  <line x1="1" y1="68" x2="1199" y2="68" stroke="#120B10" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Wordmark Left -->
  <text x="44" y="43" fill="#120B10" font-family="'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.8">
    NITROVINZLEO
  </text>
  <text x="214" y="42" fill="#9D174D" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" letter-spacing="0.6">
    / PARIS EDITION
  </text>

  <!-- Asymmetric Editorial Headline Row -->
  <text x="44" y="138" fill="#120B10" font-family="'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="44" font-weight="800" letter-spacing="-1.3">
    Code, UX &amp; systèmes,
  </text>
  <text x="44" y="190" fill="#120B10" font-family="'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="44" font-weight="800" letter-spacing="-1.3">
    pensés pour durer.
  </text>

  <!-- Right Editorial Sub-Deck -->
  <text x="734" y="142" fill="#52434C" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15.5" font-weight="500">
    Applications desktop Electron, moteurs MIDI temps réel
  </text>
  <text x="734" y="166" fill="#52434C" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15.5" font-weight="500">
    et interfaces éditoriales accessibles WCAG AAA / RGAA.
  </text>

  <!-- ===================================================================== -->
  <!-- LEFT CARD (60% — Crisp White #FFFDFD, Virtual Piano / KeyFlow Studio) -->
  <!-- ===================================================================== -->
  <rect x="44" y="238" width="664" height="338" rx="16" fill="#FFFDFD" stroke="#120B10" stroke-opacity="0.10" stroke-width="1"/>
  <g clip-path="url(#leftCardClip)">
    <!-- Top Visual Preview Area -->
    <rect x="44" y="238" width="664" height="196" fill="url(#pianoStage)"/>

    <!-- Minimalist Piano Keyboard Graphic (white + black keys, rose active key) -->
    <g transform="translate(154, 272)">
      <!-- White keys -->
      <rect x="0"   y="0" width="36" height="126" rx="4" fill="#FAF7F6" fill-opacity="0.92"/>
      <rect x="40"  y="0" width="36" height="126" rx="4" fill="#FAF7F6" fill-opacity="0.92"/>
      <rect x="80"  y="0" width="36" height="126" rx="4" fill="#FAF7F6" fill-opacity="0.92"/>
      <rect x="120" y="0" width="36" height="126" rx="4" fill="#D81B60"/>
      <rect x="160" y="0" width="36" height="126" rx="4" fill="#FAF7F6" fill-opacity="0.92"/>
      <rect x="200" y="0" width="36" height="126" rx="4" fill="#FAF7F6" fill-opacity="0.92"/>
      <rect x="240" y="0" width="36" height="126" rx="4" fill="#FAF7F6" fill-opacity="0.92"/>
      <rect x="280" y="0" width="36" height="126" rx="4" fill="#FAF7F6" fill-opacity="0.92"/>
      <rect x="320" y="0" width="36" height="126" rx="4" fill="#FDE047"/>
      <rect x="360" y="0" width="36" height="126" rx="4" fill="#FAF7F6" fill-opacity="0.92"/>
      <rect x="400" y="0" width="36" height="126" rx="4" fill="#FAF7F6" fill-opacity="0.92"/>

      <!-- Black keys -->
      <rect x="26"  y="0" width="24" height="76" rx="3" fill="#140810"/>
      <rect x="66"  y="0" width="24" height="76" rx="3" fill="#140810"/>
      <rect x="146" y="0" width="24" height="76" rx="3" fill="#140810"/>
      <rect x="186" y="0" width="24" height="76" rx="3" fill="#140810"/>
      <rect x="226" y="0" width="24" height="76" rx="3" fill="#140810"/>
      <rect x="306" y="0" width="24" height="76" rx="3" fill="#140810"/>
      <rect x="346" y="0" width="24" height="76" rx="3" fill="#140810"/>
    </g>

    <!-- Bottom White Editorial Text Area -->
    <rect x="68" y="452" width="128" height="24" rx="6" fill="#FCE7EE"/>
    <text x="132" y="468" text-anchor="middle" fill="#9D174D" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700">
      Electron &amp; MIDI
    </text>
    <text x="210" y="468" fill="#52434C" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="0.4">
      KEYFLOW STUDIO  ·  VIRTUAL PIANO
    </text>

    <text x="68" y="504" fill="#120B10" font-family="'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">
      Virtual Piano — Frappe Magique, Auto-Play &amp; Micro Virtuel
    </text>
    <text x="68" y="532" fill="#52434C" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500">
      Application desktop Electron + Tone.js MIDI avec synthèse réaliste, routage VB-Cable,
    </text>
    <text x="68" y="554" fill="#52434C" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500">
      mode streaming temps réel et intégration Discord Rich Presence.
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT CARD (40% — Deep Obsidian #140810, Gold Pill #FDE047)           -->
  <!-- ===================================================================== -->
  <rect x="734" y="238" width="422" height="338" rx="16" fill="#140810"/>
  <g clip-path="url(#rightCardClip)">
    <!-- Top Ruby Editorial Cover Band -->
    <rect x="734" y="238" width="422" height="148" fill="url(#rubyCover)"/>
    <text x="758" y="366" fill="#FBF7F8" fill-opacity="0.92" font-family="'Bricolage Grotesque', Georgia, serif" font-size="44" font-weight="800" letter-spacing="2">
      STUDIO
    </text>
    <text x="760" y="274" fill="#FDE047" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1.4">
      GITHUB DEVELOPER PROGRAM
    </text>

    <!-- Gold Pill + Mono Meta -->
    <rect x="758" y="402" width="94" height="24" rx="6" fill="#FDE047"/>
    <text x="805" y="418" text-anchor="middle" fill="#5C3409" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800">
      En cours
    </text>
    <text x="864" y="418" fill="#D9C8D0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="0.4">
      EFREI PARIS  ·  B3
    </text>

    <!-- Crisp White Editorial Headline -->
    <text x="758" y="458" fill="#FBF7F8" font-family="'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.4">
      TypeScript, Python, Electron
    </text>
    <text x="758" y="486" fill="#FBF7F8" font-family="'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.4">
      &amp; automatisation API.
    </text>

    <!-- Muted Rose-Pearl Body -->
    <text x="758" y="522" fill="#D9C8D0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="400">
      Architecture propre, accessibilité stricte et
    </text>
    <text x="758" y="544" fill="#D9C8D0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="400">
      workflows GitHub REST &amp; GraphQL sur mesure.
    </text>
  </g>
</svg>
