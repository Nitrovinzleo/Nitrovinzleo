  </text>

  <!-- Right Editorial Sub-Deck -->
  <text x="734" y="142" fill="#52434C" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15.5" font-weight="500">
