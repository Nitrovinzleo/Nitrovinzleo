      <rect x="240" y="0" width="36" height="126" rx="4" fill="#FAF7F6" fill-opacity="0.92"/>
      <rect x="280" y="0" width="36" height="126" rx="4" fill="#FAF7F6" fill-opacity="0.92"/>
      <rect x="320" y="0" width="36" height="126" rx="4" fill="#FDE047"/>
      <rect x="360" y="0" width="36" height="126" rx="4" fill="#FAF7F6" fill-opacity="0.92"/>
      <rect x="400" y="0" width="36" height="126" rx="4" fill="#FAF7F6" fill-opacity="0.92"/>

      <rect x="26"  y="0" width="24" height="76" rx="3" fill="#140810"/>
      <rect x="66"  y="0" width="24" height="76" rx="3" fill="#140810"/>
      <rect x="146" y="0" width="24" height="76" rx="3" fill="#140810"/>
      <rect x="186" y="0" width="24" height="76" rx="3" fill="#140810"/>
      <rect x="226" y="0" width="24" height="76" rx="3" fill="#140810"/>
      <rect x="306" y="0" width="24" height="76" rx="3" fill="#140810"/>
      <rect x="346" y="0" width="24" height="76" rx="3" fill="#140810"/>
